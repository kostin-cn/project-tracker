<!DOCTYPE html>
<html lang="uk" class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Заголовок та базовий опис -->
    <title>Project Tracker — Kanban таск-менеджер</title>
    <meta name="description" content="Інтерактивний таск-менеджер з Kanban-дошкою на Vue 3, TypeScript та Tailwind CSS.">

    <!-- Open Graph (Telegram, Viber, Facebook, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kostin-cn.github.io/project-tracker/">
    <meta property="og:title" content="Project Tracker | Vue 3 & TypeScript">
    <meta property="og:description" content="Сучасний таск-менеджер з Kanban-дошкою, фільтрацією та підтримкою темної теми.">
    <!-- Зображення-прев'ю (рекомендований розмір: 1200x630 px) -->
    <meta property="og:image" content="https://kostin-cn.github.io/project-tracker/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="uk_UA">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Project Tracker | Vue 3 & TypeScript">
    <meta name="twitter:description" content="Сучасний таск-менеджер з Kanban-дошкою, фільтрацією та підтримкою темної теми.">
    <meta name="twitter:image" content="https://kostin-cn.github.io/project-tracker/og-image.png">

    <!-- Прибираємо спалах: перевіряємо тему ДО рендеру сторінки -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                document.documentElement.classList.add('dark');
                document.documentElement.style.backgroundColor = '#020617'; // slate-950
            } else {
                document.documentElement.classList.remove('dark');
                document.documentElement.style.backgroundColor = '#f8fafc'; // slate-50
            }
        })();
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen antialiased">
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
